################
# Daedalus recipe: Drupal.org CI pipeline
#
# Runs the recipe project's tests on Drupal.org's standard contrib pipeline,
# provided by the gitlab_templates project: the base recipe's
# FunctionalJavascript install smoke (tests/src/FunctionalJavascript/
# DaedalusBehaviorTest.php), the ingredient retry-safety test
# (tests/src/Functional/RecipeRetrySafetyTest.php), and the AI site recipe's
# wiring tests under ai/tests/. No custom pipeline is needed: the template
# treats a recipe project as a first-class type. Page-builder behavior is
# tested in the daedalus module's own suite, on this same recipe as its
# fixture.
#
#   - It detects PROJECT_TYPE=recipe (a recipe.yml is present), symlinks the
#     project into recipes/<name>, and copies the tests in.
#   - This recipe's composer.json `require` pulls the page builder, the theme
#     and the AI stack (and Drupal core) into the web root, so the phpunit job
#     exercises the modules together exactly as a real site receives them via
#     the recipe.
#   - The phpunit job then runs the tests in this project.
#
# The AI tests never contact an LLM: they are wiring tests, not "the
# assistant answers" tests. The provider ingredients ship empty Keys, CI has
# no API key, and hitting a paid provider from CI would be slow, flaky, and
# costly. Sending a real chat turn is a deliberate manual smoke step with a
# real key, not part of this pipeline, so no provider secrets are needed here.
#
# Docs: https://project.pages.drupalcode.org/gitlab_templates/
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # The suite is tested on the two core minors composer.json allows
  # (>=11.3 <11.5). The current-core variant autoruns by default; the
  # previous-minor variant must be opted in and, since gitlab_templates 1.15,
  # is a manual job unless _AUTORUN_PREVIOUS_MINOR says otherwise (valid values:
  # none, push, push-and-mr, push-and-schedule, all). 'push' runs it on every
  # push to the canonical project, which is where a release is cut from, so
  # 11.3 stays tested without doubling every merge-request pipeline.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'push'

  # Keep _PHPUNIT_CONCURRENT at 0. It was the template default until
  # gitlab_templates 1.17.0 flipped it to 1; pinned here deliberately.
  #
  # At 0 the phpunit job invokes `phpunit <project-dir>` directly, which uses
  # PHPUnit's own file-based test discovery (it includes each *Test.php it finds,
  # under ai/tests/ as well). That is the only thing that discovers this
  # recipe's tests: Drupal's TestDiscovery / run-tests.sh (used when
  # _PHPUNIT_CONCURRENT is set to 1) does not register test namespaces under
  # recipes/, so it would silently find zero tests here. Do not set this to 1
  # without first solving recipe-test discovery under run-tests.sh.
  #
  # FunctionalJavascript needs real Chrome over WebDriver; the template's phpunit
  # job already declares the Chrome/Selenium service and wires
  # MINK_DRIVER_ARGS_WEBDRIVER, so no further configuration is required here.
  _PHPUNIT_CONCURRENT: '0'

# CI tests against sibling tips; composer.json ships stable carets.
# before_script is the documented contrib hook (gitlab_templates
# docs/info/customizations.md) and .composer-base covers all variants.
# Stability flags are root-only in Composer, so the direct siblings are
# pinned here, or their carets cannot resolve a dev branch or an alpha tag
# at the template's default (stable) minimum-stability.
.composer-base:
  before_script:
    - composer require --no-update --no-interaction
      drupal/daedalus:1.0.x-dev
      drupal/daedalus_theme:1.0.x-dev
      drupal/field_sample_value:1.1.x-dev
      drupal/twig_events:1.1.x-dev

# Tag-installability drift guard.
#
# Stability flags are root-only, so the dev pins injected above never reach
# consumers. A tag whose committed composer.json cannot resolve at DEFAULT
# (stable) minimum-stability ships broken silently: composer on consumer sites
# falls back to the newest installable tag, however ancient (this happened
# to the recipe's predecessor once: consumers silently got 0.0.22). This job
# scratch-installs the tag in a default-stability project so that failure
# mode can never ship again.
#
# daedalus_recipe itself comes from a path repository pointing at the tagged
# checkout, with the version stated explicitly (so nothing depends on git
# version-guessing or on registry tag-sync lag), while daedalus, the theme
# and every other dependency resolve from packages.drupal.org, which is the
# real test.
#
# Validate stage with no allow_failure: an uninstallable tag must fail loud.
tag-installability:
  stage: validate
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # A scratch consumer project with everything at composer defaults, in
    # particular minimum-stability: stable.
    - SCRATCH=$(mktemp -d) && cd $SCRATCH
    - composer init --name=drift/scratch --no-interaction
    # NOTE `composer config repositories.X` PREPENDS, and composer
    # repositories are canonical (the first repository providing a package
    # name wins), so the path repo is added LAST to take priority for
    # drupal/daedalus_recipe over any registry copy of the same tag.
    - composer config repositories.drupal composer https://packages.drupal.org/8
    - >-
      composer config repositories.self
      "{\"type\":\"path\",\"url\":\"$CI_PROJECT_DIR\",
      \"options\":{\"versions\":{\"drupal/daedalus_recipe\":\"$CI_COMMIT_TAG\"}}}"
    # --no-install: dependency resolution + lock writing is the drift being
    # tested; skipping the vendor/ download keeps the job fast.
    - composer require --no-install "drupal/daedalus_recipe:$CI_COMMIT_TAG"
