name: 'Daedalus Text Block'
description: 'Adds the text block type for Daedalus pages.'
type: 'Block type'

recipes:
  # Precise dependencies, not the daedalus_base alias: the engine for the
  # page-builder stack, sample values for the block type's field defaults.
  - daedalus_engine
  - daedalus_sample_values

install:
  - daedalus_edit_text_block

config:
  strict: false
  import:
    daedalus_edit_text_block: '*'
